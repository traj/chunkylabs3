<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>chunkylabs3 — nav pad v6 (word in the button)</title>
<style>
  :root{ --pink:#FF4D63; --cream:#F7EFE2; --ink:#120C08; --dim:#9A8570; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0705;display:flex;flex-direction:column;align-items:center;gap:16px;padding:32px;font-family:'Instrument Sans',system-ui,sans-serif}
  .stage{position:relative;width:1600px;height:900px;overflow:hidden;flex:none}
  .plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .22s ease}
  #plateB{opacity:0}

  .pad{
    position:absolute;left:48px;bottom:44px;width:104px;height:104px;
    opacity:1;transition:opacity .6s ease;
  }
  .pad.idle{opacity:.3}
  .pad:hover{opacity:1}

  .dir{position:absolute;cursor:pointer;transition:opacity .3s ease,transform .12s ease}
  .dir svg{display:block;width:100%;height:100%}
  .dir polygon{fill:#F7EFE2}
  .dir.on{opacity:.6}
  .dir.on:hover{opacity:1;transform:scale(1.15)}
  .dir.on:active{transform:scale(.95)}
  .dir.off{opacity:.08;pointer-events:none}
  .up   {left:40px;top:0;width:24px;height:20px}
  .down {left:40px;bottom:0;width:24px;height:20px}
  .left {left:0;top:40px;width:20px;height:24px}
  .right{right:0;top:40px;width:20px;height:24px}

  /* portal: smoke chrome disc, word inside, faint scene texture beneath */
  .portal{
    position:relative;
    position:absolute;left:28px;top:28px;width:48px;height:48px;border-radius:50%;
    cursor:pointer;overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.5), 0 2px 10px rgba(10,7,5,.5);
    transition:transform .15s ease,box-shadow .3s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .portal:hover{transform:scale(1.08);box-shadow:0 0 0 1px rgba(255,255,255,.9), 0 2px 14px rgba(10,7,5,.6)}
  .portal:active{transform:scale(.96)}
  .portal .tex{
    position:absolute;inset:0;background-size:220% auto;background-position:center 42%;
    opacity:.35;
  }
  .portal .smoke{
    position:absolute;inset:0;background:rgba(22,13,8,.55);
    backdrop-filter:blur(2px) saturate(.9);
    -webkit-backdrop-filter:blur(2px) saturate(.9);
  }
  .portal .word{
    position:relative;color:var(--cream);font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;font-weight:500;transform:translateX(.11em); /* optical center vs letterspacing */
  }

  .meta{color:#9A8570;font-size:13px;letter-spacing:.08em;text-align:center;max-width:1600px}
  .meta b{color:#F7EFE2;font-weight:500}
</style>
</head>
<body>
<div class="stage">
  <img class="plate" id="plateA" src="../../design/plates/plate-street.png" alt="">
  <img class="plate" id="plateB" src="" alt="">

  <div class="pad" id="pad">
    <div class="dir up" id="dUp"><svg viewBox="0 0 24 20"><polygon points="12,0 24,20 0,20"/></svg></div>
    <div class="dir down" id="dDown"><svg viewBox="0 0 24 20"><polygon points="0,0 24,0 12,20"/></svg></div>
    <div class="dir left" id="dLeft"><svg viewBox="0 0 20 24"><polygon points="20,0 20,24 0,12"/></svg></div>
    <div class="dir right" id="dRight"><svg viewBox="0 0 20 24"><polygon points="0,0 20,12 0,24"/></svg></div>
    <div class="portal" id="portal">
      <div class="tex" id="ptex"></div>
      <div class="smoke"></div>
      <div class="word" id="pword">OUT</div>
    </div>
  </div>
</div>
<div class="meta">
  NAV PAD v6 · no floating words — the word lives <b>inside</b> the round button: OUT / IN ·
  faint scene texture behind the word · arrows availability-lit · WASD / arrows · E or Enter = OUT/IN · idle 30% after 4s
</div>
<script>
  const G = {
    street : { up:'door',    down:null,     left:null,     right:null },
    door   : { up:'counter', down:'street', left:null,     right:null },
    counter: { up:null,      down:'door',   left:'mixes',  right:'crate' },
    mixes  : { up:null,      down:null,     left:'vibes',  right:'counter' },
    vibes  : { up:null,      down:null,     left:'crate',  right:'mixes' },
    crate  : { up:null,      down:null,     left:'counter',right:'vibes' }
  };
  const INSIDE = ['counter','mixes','vibes','crate'];
  const OUT = { counter:['door','street'], mixes:['counter','door','street'], crate:['counter','door','street'], vibes:['counter','door','street'], door:['street'] };
  const IN  = { street:['door','counter'] };

  const plates = {};
  for (const k of Object.keys(G)) plates[k] = `../../design/plates/plate-${k}.png`;

  let cur = 'street', showingA = true, busy = false, idleTimer = null;
  const btns = { up: dUp, down: dDown, left: dLeft, right: dRight };

  function paint(){
    for (const [d, btn] of Object.entries(btns)){
      btn.classList.toggle('on', !!G[cur][d]);
      btn.classList.toggle('off', !G[cur][d]);
    }
    const inside = INSIDE.includes(cur) || cur === 'door';
    ptex.style.backgroundImage = `url(${inside ? plates.street : plates.counter})`;
    pword.textContent = inside ? 'OUT' : 'IN';
  }
  function wake(){
    pad.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => pad.classList.add('idle'), 4000);
  }
  function swap(to, ms){
    const inEl  = showingA ? plateB : plateA;
    const outEl = showingA ? plateA : plateB;
    inEl.style.transitionDuration = ms + 'ms';
    outEl.style.transitionDuration = ms + 'ms';
    inEl.src = plates[to];
    inEl.style.opacity = 1;
    outEl.style.opacity = 0;
    showingA = !showingA;
    cur = to;
  }
  function go(d){
    const next = G[cur][d];
    if (!next || busy) return;
    busy = true;
    swap(next, 300);
    paint(); wake();
    setTimeout(() => busy = false, 320);
  }
  function usePortal(){
    if (busy) return;
    const route = (INSIDE.includes(cur) || cur === 'door') ? OUT[cur] : IN[cur];
    if (!route) return;
    busy = true; wake();
    let i = 0;
    (function step(){
      swap(route[i], 220);
      paint();
      i++;
      if (i < route.length) setTimeout(step, 260);
      else setTimeout(() => busy = false, 260);
    })();
  }
  dUp.addEventListener('click', () => go('up'));
  dDown.addEventListener('click', () => go('down'));
  dLeft.addEventListener('click', () => go('left'));
  dRight.addEventListener('click', () => go('right'));
  portal.addEventListener('click', usePortal);
  pad.addEventListener('mousemove', wake);
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'arrowup'    || k === 'w') go('up');
    if (k === 'arrowdown'  || k === 's') go('down');
    if (k === 'arrowleft'  || k === 'a') go('left');
    if (k === 'arrowright' || k === 'd') go('right');
    if (k === 'e' || k === 'enter') usePortal();
  });
  paint(); wake();
</script>
</body>
</html>
