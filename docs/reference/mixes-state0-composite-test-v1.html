<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chunkylabs3 — Mixes State 0 composite test v1</title>
<!--
  MIXES STATE 0 — DOM SLEEVE COMPOSITE TEST (Tier A: raw covers, CSS-only grade)
  Question under test: can a raw harvest cover, graded purely in CSS, pass as an
  object living in the plate photo? No Meshy assets involved yet.

  Open directly in real Chrome (file://). Relative paths reach the plates canon
  and the harvest — do not move this file without moving the paths.

  KEYS
    1  RAW      — cover pasted in, placed, nothing else (the floor)
    2  PLACED   — + perspective lean, rim clip (standing "in" the box)
    3  GRADED   — + warm grade: filter chain + amber multiply tint
    4  FINISHED — + grain, micro-blur, shadows, box-interior AO   (default)
    S  toggle shipped scrim (StationFrame.tsx values)             (default ON)
    F  replay the fade-in (fade-in contract choreography, 120ms stagger)

  Objects: box A = housetape-2025 (HARD case, near-white cover)
           box B = jan2k          (EASY case, warm photo)
           floor leaner = housetape-2025 at 2x scale (hard case, big)

  Tune the grade at the :root vars below; this recipe, once passed, becomes the
  shipped CSS for every State 0 object.
-->
<style>
  :root {
    /* ── grade recipe (level 3+) ─────────────────────────────── */
    --g-sepia: 0.32;        /* pushes toward the room's amber */
    --g-saturate: 1.05;
    --g-brightness: 0.93;   /* room is darker than a raw cover */
    --g-contrast: 1.06;
    --tint: rgba(255, 158, 58, 0.20);  /* amber multiply tint */
    /* ── finish (level 4) ────────────────────────────────────── */
    --f-blur: 0.4px;        /* kills digital crispness vs. the gen's softness */
    --grain-opacity: 0.55;
    --shadow: drop-shadow(0 6px 9px rgba(28, 14, 0, 0.55));
  }

  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

  /* Fixed 1920x1080 stage scaled to fit — placements stay glued to the plate
     at any window size (object-cover drift is not what this test is about). */
  #viewport { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage {
    position: relative; width: 1920px; height: 1080px;
    transform-origin: center; flex: none;
    background: url("../../design/plates/plate-mixes.png") center / cover no-repeat;
  }

  /* Shipped scrim — values from StationFrame.tsx (bg-gradient-to-t
     from-black/70 via-black/20 to-black/40). Sits OVER the scene objects,
     exactly as it does over the video layer in the real stack. */
  #scrim {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: linear-gradient(to top,
      rgba(0,0,0,0.70), rgba(0,0,0,0.20) 50%, rgba(0,0,0,0.40));
  }
  body[data-scrim="off"] #scrim { display: none; }

  /* ── sleeve object ──────────────────────────────────────────── */
  .sleeve {
    position: absolute; z-index: 10;
    opacity: 0;                      /* fade-in contract: enters after atRest */
    transition: opacity 500ms ease;
  }
  .sleeve.faded-in { opacity: 1; }
  .sleeve img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* amber tint (multiply) + box-interior AO live on overlays inside the wrap */
  .sleeve .tint, .sleeve .ao, .sleeve .grain {
    position: absolute; inset: 0; pointer-events: none; display: none;
  }
  .sleeve .tint { background: var(--tint); mix-blend-mode: multiply; }
  .sleeve .ao   { background: linear-gradient(to top, rgba(20,10,0,0.5), transparent 26%); }
  .sleeve .grain {
    opacity: var(--grain-opacity); mix-blend-mode: overlay;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0.6 0"/></filter><rect width="120" height="120" filter="url(%23n)"/></svg>');
  }

  /* ── treatment levels (set on <body data-level>) ────────────── */
  /* L2+: placement transforms + rim clip */
  body[data-level="2"] .sleeve, body[data-level="3"] .sleeve, body[data-level="4"] .sleeve {
    transform: var(--place);
    clip-path: var(--clip, none);
  }
  /* L3+: grade */
  body[data-level="3"] .sleeve img, body[data-level="4"] .sleeve img {
    filter: sepia(var(--g-sepia)) saturate(var(--g-saturate))
            brightness(var(--g-brightness)) contrast(var(--g-contrast));
  }
  body[data-level="3"] .sleeve .tint, body[data-level="4"] .sleeve .tint { display: block; }
  /* L4: finish */
  body[data-level="4"] .sleeve img {
    filter: sepia(var(--g-sepia)) saturate(var(--g-saturate))
            brightness(var(--g-brightness)) contrast(var(--g-contrast))
            blur(var(--f-blur));
  }
  body[data-level="4"] .sleeve { filter: var(--shadow); }
  body[data-level="4"] .sleeve .grain { display: block; }
  body[data-level="4"] .sleeve.in-box .ao { display: block; }

  /* ── placements (1920x1080 stage px) ────────────────────────── */
  /* Box A — center-left lamp pool. Rim y=596. 30% of the sleeve sits "inside"
     the box: top = rim - 0.70h, bottom 30% clipped → cut edge lands ON the rim. */
  #sleeveA {
    left: 992px; top: 520px; width: 108px; height: 108px;
    --place: perspective(900px) rotateY(-4deg) rotate(-1.2deg);
    --clip: inset(0 0 30% 0);
  }
  /* Box B — right of the second lamp. Rim y=591. */
  #sleeveB {
    left: 1235px; top: 517px; width: 106px; height: 106px;
    --place: perspective(900px) rotateY(3deg) rotate(0.8deg);
    --clip: inset(0 0 30% 0);
  }
  /* Floor leaner — against the lower bins, base on the boards. No clip. */
  #sleeveC {
    left: 1088px; top: 798px; width: 198px; height: 198px;
    --place: perspective(900px) rotateY(-7deg) rotate(3.5deg);
    transform-origin: 50% 100%;
  }
  /* leaner contact shadow — soft ellipse pinned under the base (L4 only) */
  #leanShadow {
    position: absolute; z-index: 9; left: 1078px; top: 976px;
    width: 220px; height: 34px; display: none; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(20,10,0,0.55), transparent 65%);
    filter: blur(4px);
  }
  body[data-level="4"] #leanShadow { display: block; }

  /* ── HUD ────────────────────────────────────────────────────── */
  #hud {
    position: absolute; z-index: 40; left: 20px; top: 20px;
    font: 12px/1.7 monospace; color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25);
    padding: 10px 14px; letter-spacing: 0.04em;
  }
  #hud b { color: #ff69b4; font-weight: 700; }
</style>
</head>
<body data-level="4" data-scrim="on">
<div id="viewport">
  <div id="stage">
    <div class="sleeve in-box" id="sleeveA">
      <img src="../../content/harvest/art/tracks/housetape-2025.jpg" alt="">
      <div class="tint"></div><div class="grain"></div><div class="ao"></div>
    </div>
    <div class="sleeve in-box" id="sleeveB">
      <img src="../../content/harvest/art/tracks/jan2k.jpg" alt="">
      <div class="tint"></div><div class="grain"></div><div class="ao"></div>
    </div>
    <div id="leanShadow"></div>
    <div class="sleeve" id="sleeveC">
      <img src="../../content/harvest/art/tracks/housetape-2025.jpg" alt="">
      <div class="tint"></div><div class="grain"></div><div class="ao"></div>
    </div>
    <div id="scrim"></div>
    <div id="hud"></div>
  </div>
</div>
<script>
  // scale the fixed stage to fit the window
  const stage = document.getElementById("stage");
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
  }
  addEventListener("resize", fit); fit();

  const LEVELS = { 1: "RAW", 2: "PLACED", 3: "GRADED", 4: "FINISHED" };
  function hud() {
    const l = document.body.dataset.level, s = document.body.dataset.scrim;
    document.getElementById("hud").innerHTML =
      `mixes state 0 · composite test v1<br>` +
      `level <b>${l} ${LEVELS[l]}</b> (keys 1-4) · scrim <b>${s.toUpperCase()}</b> (S)<br>` +
      `F replay fade-in · A=housetape B=jan2k C=leaner`;
  }
  // fade-in contract choreography: 120ms stagger, as it will run post-atRest
  function fadeIn() {
    const sleeves = [...document.querySelectorAll(".sleeve")];
    sleeves.forEach(el => el.classList.remove("faded-in"));
    sleeves.forEach((el, i) => setTimeout(() => el.classList.add("faded-in"), 250 + i * 120));
  }
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (LEVELS[k]) document.body.dataset.level = k;
    if (k === "s") document.body.dataset.scrim = document.body.dataset.scrim === "on" ? "off" : "on";
    if (k === "f") fadeIn();
    hud();
  });
  hud();
  addEventListener("load", fadeIn);
</script>
</body>
</html>
